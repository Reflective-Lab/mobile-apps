[package]
name = "reflective-mobile-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
director-contracts = { path = "../../../bedrock-platform/helms/crates/director-contracts" }
helm-client = { path = "../../../bedrock-platform/helms/crates/helm-client" }
helm-session-contracts = { path = "../../../bedrock-platform/helms/crates/helm-session-contracts" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ureq = { version = "2", default-features = false, features = ["json", "tls"] }
# On-device fixed-point engine for the local signal-refinement loop. Workspace
# path dep into the bedrock-platform/converge tree (M2.5: workspace path
# distribution). converge-core is pure (no tokio/network/server deps) and clears
# the deny.toml client boundary. NEVER use converge_core::integrity here
# (LamportClock/MerkleRoot are the collective/server chain concern — ADR 0002).
converge-core = { path = "../../../bedrock-platform/converge/crates/core" }
# Implement converge-core's async `Suggestor` trait for the local formation.
async-trait = "0.1"
# Minimal block_on to drive the async fixed-point engine in-process (no tokio).
pollster = "0.4"

[dev-dependencies]
proptest = "1"
insta = "1"
serde_json = "1"
