[package]
name = "reflective-mobile-ffi"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Product UniFFI surface exposing the Reflective mobile Rust core (Quorum field-signal capture first) to the native Swift/Kotlin shells."

[lib]
name = "reflective_mobile_ffi"
path = "src/lib.rs"
crate-type = ["staticlib", "cdylib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
doc = false

[dependencies]
reflective-mobile-ai = { path = "../mobile-ai" }
reflective-mobile-core = { path = "../mobile-core" }
uniffi = { version = "0.31.1", features = ["cli"] }

[build-dependencies]
uniffi = { version = "0.31.1", features = ["build"] }
