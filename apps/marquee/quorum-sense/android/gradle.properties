org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Dependency verification (QF-2026-06-24-04). gradle/verification-metadata.xml pins
# every resolved Maven artifact by sha256, so a tampered or swapped dependency
# fails the checksum. Generated across debug+release+androidTest+unitTest classpaths
# via `just quorum-android-verify-metadata`.
#
# Rollout is LENIENT first: a missing/mismatched entry is logged as a warning, not
# a hard failure. This protects against the one classpath we cannot resolve off-CI
# (connectedDebugAndroidTest's emulator-time orchestrator artifacts) breaking the
# build before a full green CI run confirms the file is complete. Flip to strict by
# deleting this line once CI is green (the file's verify-metadata=true then enforces).
org.gradle.dependency.verification=lenient
