org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Dependency verification (QF-2026-06-24-04) is STRICT: gradle/verification-metadata.xml
# pins every resolved Maven artifact by sha256 (verify-metadata=true), and a tampered,
# swapped, or unlisted dependency FAILS the build — no `...verification=lenient` escape.
#
# The metadata is a macOS+Linux superset: regenerate on a dev box with
# `just quorum-android-verify-metadata`, then run the "Android Verification Metadata
# (Linux)" workflow (workflow_dispatch) and commit its artifact, so the build-tooling
# artifacts the Linux CI runner resolves are included. Skipping the Linux step will
# break CI under strict.
