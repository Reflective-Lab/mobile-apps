[package]
name = "quorum-ffi"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Product UniFFI surface exposing the Reflective mobile Rust core (Quorum field-signal capture first) to the native Swift/Kotlin shells."

[lib]
name = "quorum_ffi"
path = "src/lib.rs"
crate-type = ["staticlib", "cdylib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
doc = false

[features]
# Sentry crash/error reporting, on by default for the shipped mobile builds.
# Disable (`--no-default-features`) for a lean build with no TLS/HTTP stack.
default = ["observability"]
observability = ["dep:sentry"]

[dependencies]
reflective-mobile-ai = { path = "../../../../crates/mobile-ai" }
reflective-mobile-core = { path = "../../../../crates/mobile-core" }
thiserror = "2"
uniffi = { version = "0.31.1", features = ["cli"] }
# reqwest transport with rustls-tls: pure-Rust TLS (no OpenSSL), so it
# cross-compiles cleanly to iOS *and* Android. NB: `ureq` is lighter but broken
# for TLS in sentry 0.34 — `ureq` alone has no TLS backend (events silently fail
# to send) and `ureq`+`rustls` pulls two incompatible rustls versions and won't
# build. reqwest+rustls is heavier (tokio/hyper) but actually delivers events.
# Panics + reported errors are sent directly to the separate Rust Sentry project.
#
# TRADEOFF: reqwest pulls tokio/hyper → a meaningfully larger binary than the
# intended lean `ureq`. Correctness now; optimise later. To reclaim leanness:
#   - bump sentry to a version where the `ureq`+`rustls` transport is fixed, or
#   - use `ureq`+`native-tls` (lighter, but Android then needs vendored OpenSSL).
# Verified delivering events (Sentry event abc1cd08…) and cross-compiling to
# both iOS and Android.
sentry = { version = "0.34", default-features = false, features = [
    "backtrace",
    "contexts",
    "panic",
    "reqwest",
    "rustls",
], optional = true }

[build-dependencies]
uniffi = { version = "0.31.1", features = ["build"] }

[dev-dependencies]
proptest = "1"
