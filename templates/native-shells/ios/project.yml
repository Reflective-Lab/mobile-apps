# Parametric per-app shell. Identity comes from the environment (set by
# scripts/app-config.sh); the target/scheme/product names stay constant ("App")
# so the build commands never change between apps. Generate with:
#   APP=quorum source ../../../scripts/app-config.sh && xcodegen generate
# (the Justfile's `_ios-gen` recipe does this for you).
name: App
options:
  bundleIdPrefix: se.reflective
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
targets:
  App:
    type: application
    platform: iOS
    sources:
      - App
      - path: CoreBridge
        excludes:
          - "*.xcframework/**"
    dependencies:
      - framework: CoreBridge/ReflectiveShellFFI.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${APP_BUNDLE_ID}
        PRODUCT_NAME: App
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: ${APP_NAME}
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
