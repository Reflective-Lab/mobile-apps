name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust Workspace
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal --component rustfmt,clippy

      - name: Use Rust 1.96
        run: rustup default 1.96.0

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      - name: Docs
        run: cargo doc --workspace --no-deps --locked

  ios-shell:
    name: Quorum iOS Shell
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Build SwiftUI package
        working-directory: apps/marquee/quorum-sense/ios/QuorumMobileIOS
        run: swift build

  ios-smoke-shell:
    name: iOS Smoke Shell (UniFFI + xcodebuild)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install xcodegen + just
        run: brew install xcodegen just

      - name: Install Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal

      - name: Use Rust 1.96
        run: rustup default 1.96.0

      - name: Install iOS rustup targets
        run: rustup target add aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-ios-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-ios-cargo-

      - name: Build XCFramework via UniFFI
        run: just ios-uniffi

      - name: Build iOS smoke shell
        working-directory: templates/native-shells/ios
        run: |
          xcodegen generate
          xcodebuild \
            -scheme ReflectiveShell \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            build

  android-smoke-shell:
    name: Android Smoke Shell (UniFFI + Gradle)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0 ndk;27.1.12297006"

      - name: Export ANDROID_NDK_HOME
        run: echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.1.12297006" >> "$GITHUB_ENV"

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Install Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal

      - name: Use Rust 1.96
        run: rustup default 1.96.0

      - name: Install Android rustup targets
        run: rustup target add aarch64-linux-android x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-android-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-android-cargo-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('templates/native-shells/android/**/*.gradle.kts', 'templates/native-shells/android/gradle/wrapper/*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build Android smoke shell (UniFFI + assembleDebug)
        run: just android-build

  scaffold:
    name: Mobile Scaffold
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Check scaffold contract
        run: bash scripts/check-mobile-scaffold.sh
