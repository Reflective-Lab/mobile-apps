name: Release Preflight

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: reflective/mobile-apps
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          sparse-checkout: |
            .github/actions/checkout-helms-deps
          sparse-checkout-cone-mode: false

      - uses: ./.github/actions/checkout-helms-deps

      - name: Install Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal --component rustfmt,clippy

      - name: Use Rust 1.96
        run: rustup default 1.96.0

      - name: Run gates
        run: |
          cargo fmt --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace --locked
          cargo doc --workspace --no-deps --locked
          bash scripts/check-mobile-scaffold.sh

      - name: Package scaffold artifact
        run: |
          tar -czf reflective-mobile-scaffold.tar.gz \
            README.md AGENTS.md Cargo.toml Cargo.lock Justfile \
            apps/marquee/quorum-sense \
            crates docs schemas templates

      - name: Upload scaffold artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reflective-mobile-scaffold
          path: reflective-mobile-scaffold.tar.gz
          if-no-files-found: error

  ios-product:
    name: Quorum iOS Product App
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: reflective/mobile-apps
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          sparse-checkout: |
            .github/actions/checkout-helms-deps
          sparse-checkout-cone-mode: false

      - uses: ./.github/actions/checkout-helms-deps

      - name: Install xcodegen + just
        run: brew install xcodegen just

      - name: Install Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal

      - name: Use Rust 1.96
        run: rustup default 1.96.0

      - name: Install iOS rustup targets
        run: rustup target add aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios

      - name: Build Quorum FFI and generate project
        run: just quorum-ios-gen

      - name: Build Quorum iOS app
        working-directory: reflective/mobile-apps/apps/marquee/quorum-sense/ios
        run: |
          xcodebuild \
            -scheme QuorumMobile \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            build
