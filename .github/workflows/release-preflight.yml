name: Release Preflight

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal --component rustfmt,clippy

      - name: Use Rust 1.96
        run: rustup default 1.96.0

      - name: Run gates
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace --locked
          cargo doc --workspace --no-deps --locked
          bash scripts/check-mobile-scaffold.sh

      - name: Package scaffold artifact
        run: |
          tar -czf reflective-mobile-scaffold.tar.gz \
            README.md AGENTS.md Cargo.toml Cargo.lock Justfile \
            apps/marquee/quorum-sense \
            crates docs schemas templates

      - name: Upload scaffold artifact
        uses: actions/upload-artifact@v4
        with:
          name: reflective-mobile-scaffold
          path: reflective-mobile-scaffold.tar.gz
          if-no-files-found: error

  ios-shell:
    name: Quorum iOS Shell
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Build SwiftUI package
        working-directory: apps/marquee/quorum-sense/ios/QuorumMobileIOS
        run: swift build
