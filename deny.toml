# cargo-deny configuration — mobile dependency boundary.
#
# Enforces EPIC.md Epic 4: "dependency audits prevent server-only crates from
# entering mobile builds". The mobile Rust core IS a client — it opens network
# connections to its backend and ships crash reports to Sentry, so async runtimes
# and HTTP clients (tokio, reqwest, hyper, rustls) are EXPECTED and allowed. What
# must never enter a mobile build is SERVER capability: web/RPC server frameworks,
# server-database drivers, message brokers, and cloud-provider SDKs — the
# "device proposes; server promotes" boundary (ADR 0002). This is also what keeps
# canonical-crate reuse (quorum-domain) from dragging the server in.
#
# Run: cargo deny check bans

[bans]
multiple-versions = "allow"   # not what this gate is about
wildcards = "allow"

# Server-capability crates that must never reach a mobile (client) build. Listed
# by exact name (cargo-deny bans do not glob); extend as new offenders appear.
# NB: client networking (tokio/reqwest/hyper/rustls) is intentionally NOT here.
deny = [
    # web / RPC server frameworks (the phone is a client, never a server)
    { name = "axum" },
    { name = "actix-web" },
    { name = "warp" },
    { name = "rocket" },
    { name = "poem" },
    # server-database drivers (mobile talks to its backend, not a DB directly)
    { name = "sqlx" },
    { name = "diesel" },
    { name = "sea-orm" },
    { name = "tokio-postgres" },
    { name = "postgres" },
    { name = "mysql_async" },
    { name = "mongodb" },
    { name = "redis" },
    # message brokers / streaming infra
    { name = "rdkafka" },
    { name = "lapin" },
    # cloud-provider / server SDKs
    { name = "rusoto_core" },
    { name = "aws-config" },
    { name = "google-cloud-storage" },
]

[advisories]
# Vulnerabilities are fixed by upgrading, not ignored. No active ignores.
version = 2

[licenses]
version = 2
# Permissive default so `cargo deny check bans` isn't blocked by license noise.
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "MPL-2.0", "CC0-1.0"]
