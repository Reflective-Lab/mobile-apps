# cargo-deny configuration — mobile dependency boundary.
#
# Enforces EPIC.md Epic 4: "dependency audits prevent server-only crates from
# entering mobile builds" / "CI blocks forbidden server-only dependencies in
# mobile FFI crates". Everything in this workspace cross-compiles to iOS/Android
# and must stay free of async runtimes, web servers/clients, databases, and
# cloud SDKs. Reuse of canonical crates (e.g. quorum-domain) is welcome — this
# gate is what keeps that reuse from silently dragging the server in.
#
# Run: cargo deny check bans

[bans]
multiple-versions = "allow"   # not what this gate is about
wildcards = "allow"

# Server-only crates that must never reach a mobile build. Listed by exact name
# (cargo-deny bans do not glob); extend as new offenders appear.
deny = [
    # async runtimes
    { name = "tokio" },
    { name = "async-std" },
    { name = "smol" },
    # web servers / clients / RPC
    { name = "axum" },
    { name = "hyper" },
    { name = "warp" },
    { name = "actix-web" },
    { name = "reqwest" },
    { name = "tonic" },
    { name = "tower-http" },
    # databases
    { name = "sqlx" },
    { name = "sea-orm" },
    { name = "diesel" },
    { name = "mongodb" },
    { name = "redis" },
    # message/streaming + cloud
    { name = "rdkafka" },
    { name = "rusoto_core" },
]

[advisories]
# This file scopes the bans gate; security advisories are handled separately.
version = 2

[licenses]
version = 2
# Permissive default so `cargo deny check bans` isn't blocked by license noise.
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "MPL-2.0", "CC0-1.0"]
